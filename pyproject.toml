[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Trackher"
dynamic = ["version"]
description = "Digital Footprint & Privacy Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Trackher contributors" }]
dependencies = [
  "rich>=13.0.0,<16.0.0",
  "httpx>=0.27.0,<1.0.0",
  "customtkinter>=5.2.0,<7.0.0",
  "Pillow>=10.0.0,<14.0.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
]

[project.scripts]
trackher = "main:main"

[tool.setuptools]
packages = ["assets", "footprint", "osint", "utils"]
py-modules = ["main", "gui", "setup_context_menu"]
include-package-data = true

[tool.setuptools.package-data]
osint = ["*.json"]
assets = ["logo.jpg"]

[tool.setuptools.dynamic]
version = { attr = "utils.__version__" }
