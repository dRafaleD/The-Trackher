name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Deterministik test ortamı
        shell: bash
        run: |
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Depoda secret paterni tara
        run: python -m utils.release_checks --check-secrets --root .

      - name: Bağımlılıkları doğrula
        run: python -m pip check

      - name: GUI modüllerini içe aktar
        run: python -c "import tkinter, customtkinter, PIL"

      - name: Kaynakları derle
        run: python -m compileall -q footprint osint utils gui.py main.py setup_context_menu.py

      - name: Testleri çalıştır
        run: python -m unittest discover -s tests -v

  security-audit:
    name: Security audit / SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit araçlarını kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Bağımlılık güvenlik taraması
        run: pip-audit -r requirements.txt

      - name: CycloneDX SBOM üret
        run: pip-audit -r requirements.txt --format cyclonedx-json -o trackher-sbom.cdx.json || true

      - name: SBOM artefact yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackher-sbom
          path: trackher-sbom.cdx.json
          if-no-files-found: ignore
