name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Bağımlılıkları doğrula
        run: python -m pip check

      - name: GUI modüllerini içe aktar
        run: python -c "import tkinter, customtkinter, PIL"

      - name: Kaynakları derle
        run: python -m compileall -q footprint osint utils gui.py main.py setup_context_menu.py

      - name: Testleri çalıştır
        run: python -m unittest discover -s tests -v
